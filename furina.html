<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Furina Theme Collection</title>


    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Changa:wght@400;600;700;800&family=Share+Tech+Mono&display=swap"
        rel="stylesheet"
    >


    <style>

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }


        html {

            scroll-behavior: smooth;

        }


        body {

            min-height: 100vh;

            padding:
                80px 20px 120px;

            color: #eeeeee;

            font-family:
                "Changa",
                sans-serif;

            background:

                linear-gradient(
                    rgba(10,14,23,0.70),
                    rgba(10,14,23,0.88)
                ),

                url("https://images.unsplash.com/photo-1511512578047-dfb367046420?w=1920&auto=format&fit=crop");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            background-attachment: fixed;

        }


        /* BACK BUTTON */

        .top-bar {

            position: fixed;

            top: 20px;

            left: 20px;

            z-index: 100;

        }


        .back-btn {

            display: inline-block;

            padding:
                10px 16px;

            color: #ffffff;

            background:
                rgba(15,23,42,0.90);

            border:
                2px solid #334155;

            border-radius: 6px;

            font-family:
                "Share Tech Mono",
                monospace;

            text-decoration: none;

            transition: 0.2s;

        }


        .back-btn:hover {

            color: #000000;

            background: #00f2ff;

            border-color: #ffffff;

            box-shadow:
                0 0 20px
                #00f2ff;

        }


        /* CONTAINER */

        .container {

            width: 100%;

            max-width: 800px;

            margin: auto;

        }


        /* PANEL */

        .panel {

            padding: 35px;

            text-align: center;

            background:
                rgba(15,23,42,0.90);

            border:
                2px solid #1e293b;

            border-top:
                4px solid #3a82f6;

            border-radius: 8px;

            box-shadow:
                0 20px 50px
                rgba(0,0,0,0.9);

            backdrop-filter:
                blur(12px);

        }


        /* TITLE */

        .title {

            margin-bottom: 25px;

            color: #ffffff;

            font-size:
                2.2rem;

            font-weight:
                800;

            text-shadow:
                0 0 10px
                rgba(0,242,255,0.4);

        }


        /* IMAGE */

        .preview-image {

            width: 100%;

            max-width: 700px;

            display: block;

            margin:
                0 auto 30px;

            border:
                2px solid #334155;

            border-radius: 8px;

            box-shadow:
                0 0 25px
                rgba(0,242,255,0.25);

        }


        /* DESCRIPTION */

        .description {

            margin-bottom: 25px;

            color: #cbd5e1;

            line-height: 1.7;

        }


        /* BUTTONS */

        .buttons {

            display: flex;

            flex-direction: column;

            gap: 15px;

        }


        .download-btn {

            display: block;

            padding:
                13px 20px;

            color: #ffffff;

            background:
                rgba(30,41,59,0.95);

            border:
                2px solid #334155;

            border-radius: 6px;

            font-weight:
                600;

            text-decoration: none;

            transition: 0.2s;

        }


        .download-btn:hover {

            color: #000000;

            background: #00f2ff;

            border-color: #ffffff;

            transform:
                translateY(-3px);

            box-shadow:
                0 0 20px
                rgba(0,242,255,0.8);

        }


        /* ==============================
           MUSIC BUTTON
        ============================== */

        .music-button {

            position: fixed;

            right: 20px;

            bottom: 20px;

            z-index: 999999;

            display: block;

            padding:
                12px 18px;

            color: #000000;

            background: #00f2ff;

            border:
                2px solid #ffffff;

            border-radius: 8px;

            font-family:
                "Share Tech Mono",
                monospace;

            font-size:
                14px;

            font-weight:
                bold;

            cursor: pointer;

            box-shadow:
                0 0 15px
                rgba(0,242,255,0.8);

            transition: 0.2s;

        }


        .music-button:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 0 25px
                #00f2ff;

        }


        .music-button.off {

            color: #ffffff;

            background:
                rgba(10,14,23,0.95);

            border-color:
                #334155;

            box-shadow: none;

        }


        /* MOBILE */

        @media (max-width: 600px) {

            body {

                padding:
                    80px 15px 100px;

            }


            .panel {

                padding:
                    25px 18px;

            }


            .title {

                font-size:
                    1.7rem;

            }


            .music-button {

                right: 15px;

                bottom: 15px;

            }

        }

    </style>

</head>


<body>


    <!-- =================================
         MUSIC
    ================================== -->

    <audio
        id="backgroundMusic"
        src="./menuLoop.mp3"
        loop
        preload="auto"
    ></audio>


    <!-- =================================
         BACK BUTTON
    ================================== -->

    <div class="top-bar">

        <a
            href="./index.html"
            class="back-btn"
        >

            ← BACK TO HOME

        </a>

    </div>


    <!-- =================================
         CONTENT
    ================================== -->

    <main class="container">

        <section class="panel">


            <h1 class="title">

                FURINA THEME COLLECTION

            </h1>


            <img
                src="./muxconfig.png"
                alt="Furina Theme Collection"
                class="preview-image"
            >


            <p class="description">

                Furina Theme Collection for muOS.
                Compatible with GB300 and SF2000
                when using Unifrog firmware.

            </p>


            <div class="buttons">


                <!-- GITHUB -->

                <a
                    href="https://github.com/nkgd012-tech/furina-theme-collection-for-muOS-Compatible-with-the-GB300-SF2000-if-using-Unifrog-firmware."
                    target="_blank"
                    rel="noopener noreferrer"
                    class="download-btn"
                >

                    🔗 VIEW FURINA PROJECT ON GITHUB

                </a>


                <!-- FILE 1 -->

                <a
                    href="./GenshiImpactVH.zip"
                    download
                    class="download-btn"
                >

                    📦 DOWNLOAD GenshiImpactVH.zip

                </a>


                <!-- FILE 2 -->

                <a
                    href="./furina.theme.collection.zip"
                    download
                    class="download-btn"
                >

                    📦 DOWNLOAD furina.theme.collection.zip

                </a>


            </div>


        </section>

    </main>


    <!-- =================================
         MUSIC BUTTON
    ================================== -->

    <button
        id="musicButton"
        class="music-button"
        type="button"
    >

        🔊 MUSIC ON

    </button>


    <script>

        /*
        =========================================
        MUSIC SYSTEM
        =========================================
        */


        const music =
            document.getElementById(
                "backgroundMusic"
            );


        const musicButton =
            document.getElementById(
                "musicButton"
            );


        let musicOn = true;


        /*
        UPDATE BUTTON
        */

        function updateMusicButton() {

            if (musicOn) {

                musicButton.textContent =
                    "🔊 MUSIC ON";

                musicButton.classList.remove(
                    "off"
                );

            } else {

                musicButton.textContent =
                    "🔇 MUSIC OFF";

                musicButton.classList.add(
                    "off"
                );

            }

        }


        /*
        START MUSIC
        */

        function startMusic() {

            if (!musicOn) {

                return;

            }


            music.play()
                .then(function () {

                    musicOn = true;

                    updateMusicButton();

                })
                .catch(function () {

                    console.log(
                        "Autoplay đang bị trình duyệt chặn."
                    );

                });

        }


        /*
        BUTTON ON / OFF
        */

        musicButton.addEventListener(
            "click",
            function () {

                if (musicOn) {

                    music.pause();

                    musicOn = false;

                    updateMusicButton();

                } else {

                    music.play()
                        .then(function () {

                            musicOn = true;

                            updateMusicButton();

                        });

                }

            }
        );


        /*
        AUTO PLAY
        */

        window.addEventListener(
            "load",
            function () {

                musicOn = true;

                updateMusicButton();

                startMusic();

            }
        );


        /*
        AUTOPLAY FALLBACK
        */

        function tryStartAfterInteraction() {

            if (
                musicOn &&
                music.paused
            ) {

                startMusic();

            }

        }


        document.addEventListener(
            "click",
            tryStartAfterInteraction,
            {
                once: true
            }
        );


        document.addEventListener(
            "touchstart",
            tryStartAfterInteraction,
            {
                once: true
            }
        );


        document.addEventListener(
            "keydown",
            tryStartAfterInteraction,
            {
                once: true
            }
        );


    </script>


</body>

</html>
