<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NKGD012-TECH Web</title>


    <!-- =========================
         GOOGLE FONTS
    ========================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Changa:wght@400;600;700;800&family=Share+Tech+Mono&display=swap"
        rel="stylesheet"
    >


    <!-- =========================
         FONT AWESOME
    ========================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <style>

        /* =================================
           ROOT COLORS
        ================================= */

        :root {

            --dark: #0a0e17;

            --panel: rgba(15, 23, 42, 0.88);

            --blue: #3a82f6;

            --cyan: #00f2ff;

            --white: #eeeeee;

            --muted: #94a3b8;

            --border: #334155;

        }


        /* =================================
           RESET
        ================================= */

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }


        /* =================================
           HTML
        ================================= */

        html {

            scroll-behavior: smooth;

        }


        /* =================================
           BODY
        ================================= */

        body {

            min-height: 100vh;

            position: relative;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            padding: 20px;

            overflow-x: hidden;

            color: var(--white);

            font-family: "Changa", sans-serif;


            /*
                NỀN WEBSITE

                Nếu bạn muốn dùng ảnh nền riêng
                có thể thay URL bên dưới.
            */

            background-image:

                linear-gradient(

                    rgba(10, 14, 23, 0.65),

                    rgba(10, 14, 23, 0.82)

                ),

                url("https://images.unsplash.com/photo-1511512578047-dfb367046420?w=1920&auto=format&fit=crop");


            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            background-attachment: fixed;

        }


        /* =================================
           BACKGROUND LIGHT EFFECT
        ================================= */

        body::after {

            content: "";

            position: fixed;

            inset: 0;

            z-index: 0;

            pointer-events: none;


            background:

                radial-gradient(

                    circle at 20% 20%,

                    rgba(0, 242, 255, 0.10),

                    transparent 30%

                ),


                radial-gradient(

                    circle at 80% 80%,

                    rgba(58, 130, 246, 0.12),

                    transparent 35%

                );

        }


        /* =================================
           TOP LEFT WELCOME
        ================================= */

        .top-left-welcome {

            position: absolute;

            top: 25px;

            left: 25px;

            z-index: 10;


            padding-left: 10px;


            border-left: 3px solid var(--blue);


            color: var(--white);


            font-family: "Share Tech Mono", monospace;

            font-size: 1.1rem;

            letter-spacing: 2px;

            text-transform: uppercase;


            text-shadow:

                2px 2px 4px rgba(0, 0, 0, 0.8);

        }


        /* =================================
           TOP RIGHT PROFILE
        ================================= */

        .top-right-profile {

            position: absolute;

            top: 20px;

            right: 25px;

            z-index: 10;

        }


        /* =================================
           GITHUB BUTTON
        ================================= */

        .follow-btn {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 8px;


            padding: 9px 16px;


            color: #ffffff;

            background: rgba(15, 23, 42, 0.85);


            border: 2px solid var(--border);

            border-radius: 5px;


            font-family: "Share Tech Mono", monospace;

            font-size: 0.9rem;

            text-transform: uppercase;


            text-decoration: none;


            backdrop-filter: blur(8px);


            transition: all 0.2s ease;

        }


        .follow-btn:hover {

            color: #000000;

            background: var(--cyan);

            border-color: #ffffff;


            transform: scale(1.05);


            box-shadow:

                0 0 15px rgba(0, 242, 255, 0.8);

        }


        /* =================================
           MAIN PANEL
        ================================= */

        .main-center-panel {

            position: relative;

            z-index: 10;


            width: 100%;

            max-width: 550px;


            padding: 40px 50px;


            text-align: center;


            background: var(--panel);


            border: 2px solid #1e293b;

            border-top: 4px solid var(--blue);


            border-radius: 8px;


            backdrop-filter: blur(12px);


            box-shadow:

                0 20px 50px rgba(0, 0, 0, 0.9);

        }


        /* =================================
           AVATAR FRAME
        ================================= */

        .avatar-circle-frame {

            width: 150px;

            height: 150px;


            margin: 0 auto 20px;


            display: flex;

            align-items: center;

            justify-content: center;


            overflow: hidden;


            background: #000000;


            border: 3px solid var(--blue);

            border-radius: 50%;


            box-shadow:

                0 0 20px rgba(58, 130, 246, 0.6),

                0 0 40px rgba(0, 242, 255, 0.15);

        }


        /* =================================
           AVATAR IMAGE
        ================================= */

        .avatar-img {

            width: 100%;

            height: 100%;


            display: block;


            object-fit: cover;


            filter:

                contrast(105%)

                brightness(105%);

        }


        /* =================================
           PROFILE NAME
        ================================= */

        .profile-name {

            margin-bottom: 25px;


            color: #ffffff;


            font-size: 2.2rem;

            font-weight: 800;


            letter-spacing: 2px;


            text-shadow:

                2px 2px 4px rgba(0, 0, 0, 0.9),

                0 0 10px rgba(0, 242, 255, 0.15);

        }


        /* =================================
           RELEASE BUTTONS
        ================================= */

        .release-buttons-group {

            display: flex;

            flex-direction: column;

            gap: 15px;

        }


        /* =================================
           RELEASE BUTTON
        ================================= */

        .release-btn {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 12px;


            width: 100%;


            padding: 13px 20px;


            color: #ffffff;

            background: rgba(30, 41, 59, 0.92);


            border: 2px solid var(--border);

            border-radius: 5px;


            font-family: "Changa", sans-serif;

            font-size: 1rem;

            font-weight: 600;


            text-transform: uppercase;

            text-decoration: none;


            cursor: pointer;


            transition: all 0.2s ease;

        }


        .release-btn:hover {

            color: #000000;

            background: var(--cyan);

            border-color: #ffffff;


            transform: translateY(-3px);


            box-shadow:

                0 0 20px rgba(0, 242, 255, 0.8);

        }


        /* =================================
           FOOTER
        ================================= */

        .bottom-left-footer {

            position: absolute;

            bottom: 20px;

            left: 25px;

            z-index: 10;


            color: var(--muted);


            font-family: "Share Tech Mono", monospace;

            font-size: 0.9rem;

            letter-spacing: 1px;


            text-shadow:

                1px 1px 2px rgba(0, 0, 0, 0.8);

        }


        /* =================================
           MUSIC BUTTON
        ================================= */

        .music-button {

            position: fixed;


            right: 25px;

            bottom: 25px;


            z-index: 9999;


            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;


            padding: 10px 16px;


            color: #ffffff;

            background: rgba(15, 23, 42, 0.9);


            border: 2px solid var(--border);

            border-radius: 8px;


            font-family: "Share Tech Mono", monospace;

            font-size: 0.85rem;


            cursor: pointer;


            backdrop-filter: blur(10px);


            transition: all 0.25s ease;

        }


        /* =================================
           MUSIC BUTTON HOVER
        ================================= */

        .music-button:hover {

            color: #000000;

            background: var(--cyan);

            border-color: #ffffff;


            transform: translateY(-3px);


            box-shadow:

                0 0 15px rgba(0, 242, 255, 0.8),

                0 0 30px rgba(0, 242, 255, 0.3);

        }


        /* =================================
           MUSIC BUTTON PLAYING
        ================================= */

        .music-button.playing {

            color: #000000;

            background: var(--cyan);

            border-color: #ffffff;


            box-shadow:

                0 0 15px rgba(0, 242, 255, 0.8),

                0 0 30px rgba(0, 242, 255, 0.3);

        }


        /* =================================
           MOBILE
        ================================= */

        @media (max-width: 600px) {


            body {

                justify-content: flex-start;

                padding-top: 100px;

                padding-bottom: 100px;

                overflow-y: auto;

            }


            .top-left-welcome {

                top: 15px;

                left: 15px;

                font-size: 0.8rem;

                letter-spacing: 1px;

            }


            .top-right-profile {

                top: 12px;

                right: 15px;

            }


            .follow-btn {

                padding: 7px 11px;

                font-size: 0.7rem;

            }


            .main-center-panel {

                padding: 30px 20px;

            }


            .avatar-circle-frame {

                width: 130px;

                height: 130px;

            }


            .profile-name {

                font-size: 1.8rem;

            }


            .release-btn {

                font-size: 0.85rem;

            }


            .bottom-left-footer {

                bottom: 15px;

                left: 15px;

                font-size: 0.7rem;

            }


            .music-button {

                right: 15px;

                bottom: 15px;

                padding: 9px 12px;

                font-size: 0.7rem;

            }

        }

    </style>

</head>


<body>


    <!-- =================================
         BACKGROUND MUSIC
    ================================= -->

    <audio
        id="backgroundMusic"
        src="./menuLoop.mp3"
        loop
        preload="auto"
    ></audio>



    <!-- =================================
         TOP LEFT
    ================================= -->

    <div class="top-left-welcome">

        welcome to nkgd012-tech web

    </div>



    <!-- =================================
         TOP RIGHT
    ================================= -->

    <div class="top-right-profile">

        <a
            href="https://github.com/nkgd012-tech"
            target="_blank"
            rel="noopener noreferrer"
            class="follow-btn"
        >

            <i class="fab fa-github"></i>

            follow my account

        </a>

    </div>



    <!-- =================================
         MAIN PROFILE
    ================================= -->

    <main class="main-center-panel">


        <!-- AVATAR -->

        <div class="avatar-circle-frame">

            <img
                class="avatar-img"
                src="./avatar.jpg"
                alt="NKGD2k12_VN Avatar"
            >

        </div>



        <!-- NAME -->

        <div class="profile-name">

            NKGD2k12_VN

        </div>



        <!-- BUTTONS -->

        <div class="release-buttons-group">


            <!-- =================================
                 FURINA
            ================================= -->

            <a
                href="./furina.html"
                class="release-btn"
            >

                <i class="fas fa-palette"></i>

                Furina Theme Collection

            </a>



            <!-- =================================
                 GDA
            ================================= -->

            <a
                href="./GDA.html"
                class="release-btn"
            >

                <i class="fas fa-save"></i>

                GDA Save File

            </a>


        </div>


    </main>



    <!-- =================================
         FOOTER
    ================================= -->

    <div class="bottom-left-footer">

        nkgd012-tech (nkgd2k12_vn)

        &nbsp;&bull;&nbsp;

        ©2026

    </div>



    <!-- =================================
         MUSIC BUTTON
    ================================= -->

    <button
        id="musicButton"
        class="music-button"
        type="button"
        aria-label="Bật hoặc tắt nhạc"
    >

        <i class="fas fa-volume-xmark"></i>

        <span>MUSIC OFF</span>

    </button>



    <!-- =================================
         JAVASCRIPT
    ================================= -->

    <script>

        /*
        ==================================
        LẤY CÁC PHẦN TỬ
        ==================================
        */

        const music =
            document.getElementById("backgroundMusic");

        const musicButton =
            document.getElementById("musicButton");


        /*
        ==================================
        HÀM CẬP NHẬT NÚT
        ==================================
        */

        function updateMusicButton() {


            if (music.paused) {


                musicButton.innerHTML =

                    '<i class="fas fa-volume-xmark"></i>' +

                    '<span>MUSIC OFF</span>';


                musicButton.classList.remove(
                    "playing"
                );


            } else {


                musicButton.innerHTML =

                    '<i class="fas fa-volume-high"></i>' +

                    '<span>MUSIC ON</span>';


                musicButton.classList.add(
                    "playing"
                );

            }

        }


        /*
        ==================================
        BẬT / TẮT NHẠC
        ==================================
        */

        musicButton.addEventListener(
            "click",
            async function () {


                try {


                    if (music.paused) {


                        await music.play();


                        updateMusicButton();


                    } else {


                        music.pause();


                        updateMusicButton();


                    }


                } catch (error) {


                    console.log(
                        "Không thể phát nhạc:",
                        error
                    );


                }

            }
        );


        /*
        ==================================
        ĐẢM BẢO NÚT LUÔN ĐỒNG BỘ
        ==================================
        */

        music.addEventListener(
            "play",
            updateMusicButton
        );


        music.addEventListener(
            "pause",
            updateMusicButton
        );


        /*
        ==================================
        NHẠC PHÁT LẶP LIÊN TỤC
        ==================================

        Thuộc tính loop ở thẻ audio đã đảm bảo
        nhạc tự động quay lại từ đầu khi hết bài.

        Đoạn này là lớp bảo vệ bổ sung.
        ==================================
        */

        music.addEventListener(
            "ended",
            function () {

                music.currentTime = 0;

                music.play();

            }
        );


        /*
        ==================================
        TRẠNG THÁI BAN ĐẦU
        ==================================
        */

        updateMusicButton();

    </script>


</body>

</html>
