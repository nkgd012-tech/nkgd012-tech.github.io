<!DOCTYPE html>
<html lang="vi">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>nkgd012-tech Web</title>


    <!-- GOOGLE FONT -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Changa:wght@400;600;700;800&family=Share+Tech+Mono&display=swap"
        rel="stylesheet"
    >


    <!-- FONT AWESOME -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <style>

        :root {

            --blue: #3a82f6;

            --cyan: #00eaff;

            --white: #ffffff;

            --muted: #aab6ca;

            --panel: rgba(12, 20, 35, 0.88);

        }


        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }


        html {

            scroll-behavior: smooth;

        }


        body {

            min-height: 100vh;

            overflow-x: hidden;

            color: var(--white);

            font-family: "Changa", sans-serif;

            background:

                linear-gradient(

                    rgba(5, 9, 18, 0.65),

                    rgba(5, 9, 18, 0.80)

                ),

                url("https://images.unsplash.com/photo-1511512578047-dfb367046420?w=1920&auto=format&fit=crop")

                center center / cover fixed;

        }


        /* =========================
           BACKGROUND EFFECT
        ========================= */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            z-index: 0;

            pointer-events: none;

            background:

                radial-gradient(

                    circle at 20% 20%,

                    rgba(0, 234, 255, 0.12),

                    transparent 30%

                ),

                radial-gradient(

                    circle at 80% 80%,

                    rgba(139, 92, 246, 0.12),

                    transparent 30%

                );

        }


        /* =========================
           TOP LEFT
        ========================= */

        .top-left {

            position: fixed;

            top: 22px;

            left: 22px;

            z-index: 10;

            padding-left: 12px;

            border-left: 3px solid var(--blue);

            font-family: "Share Tech Mono", monospace;

            font-size: 1rem;

            letter-spacing: 2px;

            text-shadow: 0 2px 8px #000000;

        }


        /* =========================
           TOP RIGHT
        ========================= */

        .top-right {

            position: fixed;

            top: 18px;

            right: 22px;

            z-index: 10;

        }


        /* =========================
           GITHUB BUTTON
        ========================= */

        .follow-btn {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            padding: 10px 18px;

            color: var(--white);

            background: rgba(20, 31, 52, 0.9);

            border: 2px solid #405273;

            border-radius: 8px;

            font-family: "Share Tech Mono", monospace;

            text-decoration: none;

            transition: 0.25s ease;

        }


        .follow-btn:hover {

            color: #000000;

            background: var(--cyan);

            border-color: #ffffff;

            transform: translateY(-3px);

            box-shadow:

                0 0 12px var(--cyan),

                0 0 30px rgba(0, 234, 255, 0.45);

        }


        /* =========================
           MAIN
        ========================= */

        main {

            position: relative;

            z-index: 2;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 100px 25px 60px;

        }


        /* =========================
           MAIN PANEL
        ========================= */

        .main-panel {

            width: 100%;

            max-width: 560px;

            padding: 40px;

            text-align: center;

            background: var(--panel);

            border: 1px solid rgba(255, 255, 255, 0.1);

            border-top: 4px solid var(--blue);

            border-radius: 15px;

            backdrop-filter: blur(12px);

            box-shadow:

                0 20px 60px rgba(0, 0, 0, 0.65);

        }


        /* =========================
           AVATAR
        ========================= */

        .avatar-frame {

            width: 170px;

            height: 170px;

            margin: 0 auto 24px;

            overflow: hidden;

            border-radius: 50%;

            border: 3px solid var(--blue);

            background: #000000;

            box-shadow:

                0 0 15px var(--blue),

                0 0 35px rgba(58, 130, 246, 0.55);

        }


        .avatar-frame img {

            width: 100%;

            height: 100%;

            display: block;

            object-fit: cover;

            object-position: center;

            transition: 0.35s ease;

        }


        .avatar-frame:hover img {

            transform: scale(1.08);

        }


        /* =========================
           PROFILE NAME
        ========================= */

        .profile-name {

            margin-bottom: 28px;

            font-size: 2.4rem;

            font-weight: 800;

            letter-spacing: 2px;

            text-shadow:

                0 0 8px var(--cyan),

                0 0 25px rgba(0, 234, 255, 0.75);

        }


        /* =========================
           BUTTON GROUP
        ========================= */

        .button-group {

            display: flex;

            flex-direction: column;

            gap: 16px;

        }


        /* =========================
           RELEASE BUTTON
        ========================= */

        .release-btn {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            width: 100%;

            padding: 14px 20px;

            color: var(--white);

            background: rgba(20, 31, 52, 0.9);

            border: 2px solid #405273;

            border-radius: 8px;

            font-size: 1rem;

            font-weight: 700;

            text-decoration: none;

            transition: 0.25s ease;

        }


        .release-btn:hover {

            color: #000000;

            background: var(--cyan);

            border-color: #ffffff;

            transform: translateY(-3px);

            box-shadow:

                0 0 12px var(--cyan),

                0 0 30px rgba(0, 234, 255, 0.45);

        }


        /* =========================
           FOOTER
        ========================= */

        .footer {

            position: fixed;

            bottom: 20px;

            left: 25px;

            z-index: 5;

            color: var(--muted);

            font-family: "Share Tech Mono", monospace;

            font-size: 0.9rem;

            text-shadow: 0 2px 5px #000000;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {


            .top-left {

                top: 14px;

                left: 14px;

                font-size: 0.72rem;

                letter-spacing: 1px;

            }


            .top-right {

                top: 10px;

                right: 12px;

            }


            .follow-btn {

                padding: 7px 10px;

                font-size: 0.72rem;

            }


            main {

                padding: 90px 15px 70px;

            }


            .main-panel {

                padding: 30px 20px;

            }


            .avatar-frame {

                width: 145px;

                height: 145px;

            }


            .profile-name {

                font-size: 1.8rem;

            }


            .release-btn {

                font-size: 0.9rem;

                padding: 13px 12px;

            }


            .footer {

                left: 15px;

                bottom: 12px;

                font-size: 0.75rem;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         TOP LEFT
    ========================= -->

    <div class="top-left">

        WELCOME TO NKGD012-TECH WEB

    </div>



    <!-- =========================
         GITHUB
    ========================= -->

    <div class="top-right">

        <a
            class="follow-btn"

            href="https://github.com/nkgd012-tech"

            target="_blank"

            rel="noopener noreferrer"
        >

            <i class="fab fa-github"></i>

            FOLLOW MY ACCOUNT

        </a>

    </div>



    <!-- =========================
         MAIN
    ========================= -->

    <main>


        <div class="main-panel">


            <!-- AVATAR -->

            <div class="avatar-frame">

                <img
                    src="avatar.jpg"
                    alt="NKGD2K12_VN Avatar"
                >

            </div>


            <!-- NAME -->

            <div class="profile-name">

                NKGD2K12_VN

            </div>


            <!-- BUTTONS -->

            <div class="button-group">


                <!-- FURINA -->

                <a
                    class="release-btn"

                    href="furina.html"
                >

                    <i class="fas fa-palette"></i>

                    FURINA THEME COLLECTION

                </a>



                <!-- GDA -->

                <a
                    class="release-btn"

                    href="GDA.html"
                >

                    <i class="fas fa-gamepad"></i>

                    GEOMETRY DASH ADVANCE SAVE FILE

                </a>


            </div>


        </div>


    </main>



    <!-- =========================
         FOOTER
    ========================= -->

    <div class="footer">

        nkgd012-tech (NKGD2K12_VN)

        &nbsp;&bull;&nbsp;

        © 2026

    </div>


</body>

</html>
