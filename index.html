<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NKGD012-TECH Web</title>


    <!-- GOOGLE FONTS -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Changa:wght@400;600;700;800&family=Share+Tech+Mono&display=swap"
        rel="stylesheet"
    >


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            min-height: 100vh;

            position: relative;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            padding: 20px;

            overflow-x: hidden;

            color: #eeeeee;

            font-family: "Changa", sans-serif;

            background:

                linear-gradient(
                    rgba(10, 14, 23, 0.65),
                    rgba(10, 14, 23, 0.82)
                ),

                url("https://images.unsplash.com/photo-1511512578047-dfb367046420?w=1920&auto=format&fit=crop");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            background-attachment: fixed;

        }


        /* TOP LEFT */

        .top-left-welcome {

            position: absolute;

            top: 25px;

            left: 25px;

            z-index: 10;

            padding-left: 10px;

            border-left: 3px solid #3a82f6;

            color: #ffffff;

            font-family:
                "Share Tech Mono",
                monospace;

            font-size: 1.1rem;

            letter-spacing: 2px;

            text-transform: uppercase;

            text-shadow:
                2px 2px 4px rgba(0,0,0,0.8);

        }


        /* TOP RIGHT */

        .top-right-profile {

            position: absolute;

            top: 20px;

            right: 25px;

            z-index: 10;

        }


        .follow-btn {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            padding: 9px 16px;

            color: #ffffff;

            background:
                rgba(15, 23, 42, 0.85);

            border:
                2px solid #334155;

            border-radius: 5px;

            font-family:
                "Share Tech Mono",
                monospace;

            font-size: 0.9rem;

            text-transform: uppercase;

            text-decoration: none;

            backdrop-filter: blur(8px);

            transition: 0.2s;

        }


        .follow-btn:hover {

            color: #000000;

            background: #00f2ff;

            border-color: #ffffff;

            transform: scale(1.05);

            box-shadow:
                0 0 15px
                rgba(0,242,255,0.8);

        }


        /* MAIN PANEL */

        .main-center-panel {

            position: relative;

            z-index: 10;

            width: 100%;

            max-width: 550px;

            padding: 40px 50px;

            text-align: center;

            background:
                rgba(15, 23, 42, 0.88);

            border:
                2px solid #1e293b;

            border-top:
                4px solid #3a82f6;

            border-radius: 8px;

            backdrop-filter: blur(12px);

            box-shadow:
                0 20px 50px
                rgba(0,0,0,0.9);

        }


        /* AVATAR */

        .avatar-circle-frame {

            width: 150px;

            height: 150px;

            margin:
                0 auto 20px;

            overflow: hidden;

            background: #000000;

            border:
                3px solid #3a82f6;

            border-radius: 50%;

            box-shadow:
                0 0 20px
                rgba(58,130,246,0.6);

        }


        .avatar-img {

            width: 100%;

            height: 100%;

            display: block;

            object-fit: cover;

        }


        /* NAME */

        .profile-name {

            margin-bottom: 25px;

            color: #ffffff;

            font-size: 2.2rem;

            font-weight: 800;

            letter-spacing: 2px;

            text-shadow:
                2px 2px 4px
                rgba(0,0,0,0.9);

        }


        /* BUTTON GROUP */

        .release-buttons-group {

            display: flex;

            flex-direction: column;

            gap: 15px;

        }


        /* RELEASE BUTTON */

        .release-btn {

            display: flex;

            align-items: center;

            justify-content: center;

            width: 100%;

            padding: 13px 20px;

            color: #ffffff;

            background:
                rgba(30,41,59,0.92);

            border:
                2px solid #334155;

            border-radius: 5px;

            font-size: 1rem;

            font-weight: 600;

            text-transform: uppercase;

            text-decoration: none;

            transition: 0.2s;

        }


        .release-btn:hover {

            color: #000000;

            background: #00f2ff;

            border-color: #ffffff;

            transform:
                translateY(-3px);

            box-shadow:
                0 0 20px
                rgba(0,242,255,0.8);

        }


        /* FOOTER */

        .bottom-left-footer {

            position: absolute;

            bottom: 20px;

            left: 25px;

            z-index: 10;

            color: #94a3b8;

            font-family:
                "Share Tech Mono",
                monospace;

            font-size: 0.9rem;

            letter-spacing: 1px;

        }


        /* MUSIC BUTTON */

        .music-button {

            position: fixed;

            right: 20px;

            bottom: 20px;

            z-index: 99999;

            padding: 12px 18px;

            color: #000000;

            background: #00f2ff;

            border:
                2px solid #ffffff;

            border-radius: 8px;

            font-family:
                "Share Tech Mono",
                monospace;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 0 15px
                rgba(0,242,255,0.8);

            transition: 0.2s;

        }


        .music-button:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 0 25px
                #00f2ff;

        }


        .music-button.off {

            color: #ffffff;

            background:
                rgba(10,14,23,0.95);

            border-color:
                #334155;

            box-shadow: none;

        }


        /* MOBILE */

        @media (max-width: 600px) {

            body {

                justify-content:
                    flex-start;

                padding-top: 100px;

                padding-bottom: 100px;

            }


            .top-left-welcome {

                top: 15px;

                left: 15px;

                font-size: 0.75rem;

            }


            .top-right-profile {

                top: 12px;

                right: 15px;

            }


            .follow-btn {

                padding:
                    7px 11px;

                font-size:
                    0.7rem;

            }


            .main-center-panel {

                padding:
                    30px 20px;

            }


            .avatar-circle-frame {

                width: 130px;

                height: 130px;

            }


            .profile-name {

                font-size:
                    1.8rem;

            }


            .release-btn {

                font-size:
                    0.85rem;

            }


            .bottom-left-footer {

                bottom: 15px;

                left: 15px;

                font-size:
                    0.7rem;

            }


            .music-button {

                right: 15px;

                bottom: 15px;

            }

        }

    </style>

</head>


<body>


    <!-- NHẠC NỀN -->

    <audio
        id="backgroundMusic"
        src="./menuLoop.mp3"
        autoplay
        loop
        preload="auto"
    ></audio>


    <!-- WELCOME -->

    <div class="top-left-welcome">

        welcome to nkgd012-tech web

    </div>


    <!-- GITHUB -->

    <div class="top-right-profile">

        <a
            href="https://github.com/nkgd012-tech"
            target="_blank"
            rel="noopener noreferrer"
            class="follow-btn"
        >

            GitHub

        </a>

    </div>


    <!-- MAIN -->

    <main class="main-center-panel">


        <!-- AVATAR -->

        <div class="avatar-circle-frame">

            <img
                src="./avatar.jpg"
                alt="NKGD2k12_VN Avatar"
                class="avatar-img"
            >

        </div>


        <!-- NAME -->

        <div class="profile-name">

            NKGD2k12_VN

        </div>


        <!-- BUTTONS -->

        <div class="release-buttons-group">


            <a
                href="./furina.html"
                class="release-btn"
            >

                🎨 Furina Theme Collection

            </a>


            <a
                href="./GDA.html"
                class="release-btn"
            >

                🎮 GDA Save File

            </a>


        </div>

    </main>


    <!-- FOOTER -->

    <div class="bottom-left-footer">

        nkgd012-tech (nkgd2k12_vn)
        &nbsp;&bull;&nbsp;
        ©2026

    </div>


    <!-- MUSIC BUTTON -->

    <button
        id="musicButton"
        class="music-button"
        type="button"
    >

        🔊 MUSIC ON

    </button>


    <script>

        const music =
            document.getElementById(
                "backgroundMusic"
            );

        const musicButton =
            document.getElementById(
                "musicButton"
            );


        let musicOn = true;


        function updateMusicButton() {

            if (musicOn) {

                musicButton.textContent =
                    "🔊 MUSIC ON";

                musicButton.classList.remove(
                    "off"
                );

            } else {

                musicButton.textContent =
                    "🔇 MUSIC OFF";

                musicButton.classList.add(
                    "off"
                );

            }

        }


        musicButton.addEventListener(
            "click",
            function () {

                if (musicOn) {

                    music.pause();

                    musicOn = false;

                } else {

                    music.play()
                        .then(function () {

                            musicOn = true;

                            updateMusicButton();

                        })
                        .catch(function () {

                            console.log(
                                "Không thể phát nhạc."
                            );

                        });

                    return;

                }


                updateMusicButton();

            }
        );


        window.addEventListener(
            "load",
            function () {

                musicOn = true;

                updateMusicButton();


                music.play()
                    .catch(function () {

                        console.log(
                            "Autoplay bị trình duyệt chặn. Hãy bấm MUSIC ON."
                        );

                    });

            }
        );

    </script>


</body>

</html>
