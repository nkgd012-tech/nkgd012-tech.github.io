<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NKGD012-TECH Web</title>


    <!-- =========================
         GOOGLE FONTS
    ========================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Changa:wght@400;600;700;800&family=Share+Tech+Mono&display=swap"
        rel="stylesheet"
    >


    <!-- =========================
         FONT AWESOME
    ========================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <style>

        /* =========================
           ROOT
        ========================== */

        :root {

            --dark: #050912;

            --panel: rgba(12, 20, 35, 0.88);

            --blue: #3a82f6;

            --cyan: #00eaff;

            --white: #ffffff;

            --muted: #aab6ca;

            --border: rgba(255, 255, 255, 0.12);

        }


        /* =========================
           RESET
        ========================== */

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }


        html {

            scroll-behavior: smooth;

        }


        /* =========================
           BODY
        ========================== */

        body {

            min-height: 100vh;

            overflow-x: hidden;

            position: relative;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            padding: 20px;

            color: var(--white);

            font-family: "Changa", sans-serif;


            /*
            ẢNH NỀN

            Bạn có thể thay URL này bằng
            ảnh nền của sảnh chính cũ nếu muốn.
            */

            background:

                linear-gradient(

                    rgba(5, 9, 18, 0.65),

                    rgba(5, 9, 18, 0.80)

                ),

                url("https://images.unsplash.com/photo-1511512578047-dfb367046420?w=1920&auto=format&fit=crop")

                center center / cover fixed;

        }


        /* =========================
           BACKGROUND LIGHT EFFECT
        ========================== */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            z-index: 0;

            pointer-events: none;

            background:

                radial-gradient(

                    circle at 15% 20%,

                    rgba(0, 234, 255, 0.12),

                    transparent 30%

                ),

                radial-gradient(

                    circle at 85% 80%,

                    rgba(139, 92, 246, 0.12),

                    transparent 30%

                );

        }


        /* =========================
           TOP LEFT WELCOME
        ========================== */

        .top-left-welcome {

            position: fixed;

            top: 25px;

            left: 25px;

            z-index: 10;

            padding-left: 12px;

            border-left: 3px solid var(--blue);

            color: var(--white);

            font-family: "Share Tech Mono", monospace;

            font-size: 1rem;

            letter-spacing: 2px;

            text-transform: uppercase;

            text-shadow:

                0 2px 8px rgba(0, 0, 0, 0.8);

        }


        /* =========================
           TOP RIGHT GITHUB
        ========================== */

        .top-right-profile {

            position: fixed;

            top: 20px;

            right: 25px;

            z-index: 10;

        }


        .follow-btn {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 9px;

            padding: 9px 17px;

            color: var(--white);

            background: rgba(15, 23, 42, 0.88);

            border: 2px solid #334155;

            border-radius: 8px;

            font-family: "Share Tech Mono", monospace;

            font-size: 0.9rem;

            text-transform: uppercase;

            text-decoration: none;

            backdrop-filter: blur(8px);

            transition: all 0.25s ease;

        }


        .follow-btn:hover {

            color: #000000;

            background: var(--cyan);

            border-color: var(--white);

            transform: translateY(-3px);

            box-shadow:

                0 0 12px var(--cyan),

                0 0 30px rgba(0, 234, 255, 0.45);

        }


        /* =========================
           MAIN PANEL
        ========================== */

        .main-center-panel {

            position: relative;

            z-index: 5;

            width: 100%;

            max-width: 550px;

            padding: 40px 50px;

            text-align: center;

            background: var(--panel);

            border: 1px solid var(--border);

            border-top: 4px solid var(--blue);

            border-radius: 15px;

            backdrop-filter: blur(14px);

            box-shadow:

                0 20px 60px rgba(0, 0, 0, 0.70);

        }


        /* =========================
           AVATAR FRAME
        ========================== */

        .avatar-circle-frame {

            width: 150px;

            height: 150px;

            margin: 0 auto 22px;

            padding: 3px;

            overflow: hidden;

            background: #000000;

            border: 3px solid var(--blue);

            border-radius: 50%;

            box-shadow:

                0 0 15px rgba(58, 130, 246, 0.65),

                0 0 35px rgba(0, 234, 255, 0.20);

        }


        /* =========================
           AVATAR IMAGE
        ========================== */

        .avatar-img {

            display: block;

            width: 100%;

            height: 100%;

            object-fit: cover;

            border-radius: 50%;

        }


        /* =========================
           PROFILE NAME
        ========================== */

        .profile-name {

            margin-bottom: 28px;

            color: var(--white);

            font-size: 2.2rem;

            font-weight: 800;

            letter-spacing: 2px;

            text-shadow:

                0 0 8px rgba(0, 234, 255, 0.25),

                2px 2px 4px rgba(0, 0, 0, 0.9);

        }


        /* =========================
           BUTTON GROUP
        ========================== */

        .release-buttons-group {

            display: flex;

            flex-direction: column;

            gap: 15px;

        }


        /* =========================
           RELEASE BUTTON
        ========================== */

        .release-btn {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 12px;

            width: 100%;

            padding: 13px 20px;

            color: var(--white);

            background: rgba(30, 41, 59, 0.92);

            border: 2px solid #334155;

            border-radius: 8px;

            font-size: 1rem;

            font-weight: 600;

            text-transform: uppercase;

            text-decoration: none;

            cursor: pointer;

            transition: all 0.25s ease;

        }


        .release-btn:hover {

            color: #000000;

            background: var(--cyan);

            border-color: var(--white);

            transform: translateY(-3px);

            box-shadow:

                0 0 12px var(--cyan),

                0 0 30px rgba(0, 234, 255, 0.50);

        }


        .release-btn i {

            font-size: 1.1rem;

        }


        /* =========================
           BOTTOM LEFT FOOTER
        ========================== */

        .bottom-left-footer {

            position: fixed;

            bottom: 20px;

            left: 25px;

            z-index: 10;

            color: var(--muted);

            font-family: "Share Tech Mono", monospace;

            font-size: 0.85rem;

            letter-spacing: 1px;

            text-shadow:

                1px 1px 3px rgba(0, 0, 0, 0.8);

        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 600px) {


            body {

                min-height: 100vh;

                justify-content: flex-start;

                padding-top: 100px;

                padding-bottom: 80px;

                overflow-y: auto;

            }


            .top-left-welcome {

                top: 15px;

                left: 15px;

                font-size: 0.72rem;

                letter-spacing: 1px;

            }


            .top-right-profile {

                top: 12px;

                right: 15px;

            }


            .follow-btn {

                padding: 7px 11px;

                font-size: 0.72rem;

            }


            .main-center-panel {

                padding: 30px 20px;

                border-radius: 12px;

            }


            .avatar-circle-frame {

                width: 125px;

                height: 125px;

            }


            .profile-name {

                font-size: 1.7rem;

                letter-spacing: 1px;

            }


            .release-btn {

                padding: 12px 15px;

                font-size: 0.85rem;

            }


            .bottom-left-footer {

                bottom: 15px;

                left: 15px;

                font-size: 0.7rem;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         TOP LEFT
    ========================== -->

    <div class="top-left-welcome">

        Welcome to NKGD012-TECH Web

    </div>



    <!-- =========================
         TOP RIGHT
    ========================== -->

    <div class="top-right-profile">


        <!--
        Đổi link này thành GitHub profile
        của bạn nếu cần.
        -->

        <a
            href="https://github.com/nkgd012-tech"
            target="_blank"
            rel="noopener noreferrer"
            class="follow-btn"
        >

            <i class="fab fa-github"></i>

            Follow My Account

        </a>


    </div>



    <!-- =========================
         MAIN PROFILE
    ========================== -->

    <main class="main-center-panel">


        <!-- =========================
             AVATAR
        ========================== -->

        <div class="avatar-circle-frame">


            <!--
            ẢNH AVATAR NẰM CÙNG THƯ MỤC
            VỚI FILE index.html

            Tên file:
            avatar.jpg
            -->

            <img
                class="avatar-img"
                src="./avatar.jpg"
                alt="NKGD2k12_VN Avatar"
            >


        </div>



        <!-- =========================
             PROFILE NAME
        ========================== -->

        <div class="profile-name">

            NKGD2k12_VN

        </div>



        <!-- =========================
             RELEASE BUTTONS
        ========================== -->

        <div class="release-buttons-group">


            <!-- =========================
                 FURINA
            ========================== -->

            <a
                href="./furina.html"
                class="release-btn"
            >

                <i class="fas fa-palette"></i>

                FURINA THEME COLLECTION

            </a>



            <!-- =========================
                 GDA
            ========================== -->

            <a
                href="./GDA.html"
                class="release-btn"
            >

                <i class="fas fa-gamepad"></i>

                GEOMETRY DASH ADVANCE SAVE FILE

            </a>


        </div>


    </main>



    <!-- =========================
         FOOTER
    ========================== -->

    <div class="bottom-left-footer">

        nkgd012-tech (nkgd2k12_vn)

        &nbsp;&bull;&nbsp;

        © 2026

    </div>


</body>

</html>
