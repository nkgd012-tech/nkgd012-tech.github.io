<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nkgd012-tech Web</title>
    <!-- Thư viện phông chữ Retro và Icon hệ thống -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        :root {
            /* Đồng bộ hệ màu sắc Neon theo tông xanh nước biển và tím của Furina */
            --es-dark: #0a0e17;
            --es-stripe: #3a82f6; /* Dải viền xanh dương sáng */
            --es-text-white: #eeeeee;
            --es-text-muted: #94a3b8;
            --es-selection: #00f2ff; /* Màu xanh cyan rực rỡ khi di chuột */
            --border-retro: 2px solid #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Changa', sans-serif;
            /* Nhúng link ảnh nền lưới neon màu tím trực tiếp qua máy chủ CDN để tránh lỗi */
            background-image: url('https://unsplash.com');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: var(--es-dark);
            color: var(--es-text-white);
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        /* Lớp phủ sẫm màu giúp nổi bật phần bảng điều khiển trung tâm */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 14, 23, 0.55);
            z-index: 1;
        }

        /* ----------------------------------
           GÓC TRÊN BÊN TRÁI: WELCOME TEXT
        ------------------------------------- */
        .top-left-welcome {
            position: absolute;
            top: 25px;
            left: 25px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1rem;
            color: var(--es-text-white);
            text-transform: uppercase;
            letter-spacing: 2px;
            border-left: 3px solid var(--es-stripe);
            padding-left: 10px;
            z-index: 10;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        /* ----------------------------------
           GÓC TRÊN BÊN PHẢI: FOLLOW BUTTON
        ------------------------------------- */
        .top-right-profile {
            position: absolute;
            top: 20px;
            right: 25px;
            z-index: 10;
        }

        .follow-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(15, 23, 42, 0.8);
            color: #fff;
            border: 2px solid #334155;
            padding: 8px 16px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 2px;
            transition: all 0.15s ease-in-out;
            backdrop-filter: blur(5px);
        }

        .follow-btn:hover {
            background: var(--es-stripe);
            border-color: #fff;
            box-shadow: 0 0 15px rgba(58, 130, 246, 0.7);
            transform: scale(1.05);
        }

        /* ----------------------------------
           CHÍNH GIỮA MÀN HÌNH: MAIN PROFILE & BUTTONS
        ------------------------------------- */
        .main-center-panel {
            text-align: center;
            background: rgba(15, 23, 42, 0.85);
            border: var(--border-retro);
            border-top: 4px solid var(--es-stripe);
            padding: 40px 50px;
            border-radius: 4px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            max-width: 550px;
            width: 100%;
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        /* Khung chứa ảnh đại diện hình tròn hoàn chỉnh */
        .avatar-circle-frame {
            width: 150px;
            height: 150px;
            border: 3px solid var(--es-stripe);
            background: #000;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(58, 130, 246, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(102%) brightness(102%);
        }

        .profile-name {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
            margin-bottom: 25px;
        }

        /* Khu vực chứa các nút bấm */
        .release-buttons-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .release-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(30, 41, 59, 0.9);
            border: 2px solid #334155;
            color: #fff;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 2px;
            transition: all 0.15s ease-in-out;
        }

        .release-btn:hover {
            background: var(--es-selection);
            border-color: #ffffff;
            color: #000000;
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.8);
        }

        /* ----------------------------------
           GÓC DƯỚI BÊN TRÁI: FOOTER TEXT
        ------------------------------------- */
        .bottom-left-footer {
            position: absolute;
            bottom: 20px;
            left: 25px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            color: var(--es-text-muted);
            letter-spacing: 1px;
            z-index: 10;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        @media (max-width: 600px) {
            body {
                justify-content: flex-start;
                padding-top: 100px;
                padding-bottom: 80px;
                overflow-y: auto;
            }
            .top-left-welcome { top: 15px; left: 15px; font-size: 0.9rem; }
            .top-right-profile { top: 12px; right: 15px; }
            .follow-btn { padding: 6px 12px; font-size: 0.8rem; }
            .main-center-panel { padding: 30px 20px; }
            .profile-name { font-size: 1.8rem; }
            .bottom-left-footer { bottom: 15px; left: 15px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <!-- GÓC TRÊN BÊN TRÁI -->
    <div class="top-left-welcome">
        welcome to nkgd012-tech web
    </div>

    <!-- GÓC TRÊN BÊN PHẢI -->
    <div class="top-right-profile">
        <!-- Đường dẫn nút follow tài khoản chính xác của bạn -->
        <a href="https://github.com/nkgd012-tech" target="_blank" class="follow-btn">
            <i class="fab fa-github"></i> follow my account
        </a>
    </div>

    <!-- CHÍNH GIỮA MÀN HÌNH -->
    <div class="main-center-panel">
        <div class="avatar-circle-frame">
            <img class="avatar-img" src="https://githubusercontent.com" alt="NKGD2k12_VN Avatar">
        </div>
        
        <div class="profile-name">NKGD2k12_VN</div>
        
        <div class="release-buttons-group">
            <!-- Nút 1: Furina Theme - Đã mã hóa ký tự chấm cuối link thành %2E tránh lỗi 404 hệ thống -->
            <a href="https://github.com/nkgd012-tech/furina-theme-collection-for-muOS-Compatible-with-the-GB300-SF2000-if-using-Unifrog-firmware." target="_blank" class="release-btn">
                <i class="fas fa-palette"></i> furina theme collection
            </a>
            <!-- Nút 2: GDA Save File - Trỏ chuẩn xác về link repo game Geometry Dash Advance -->
            <a href="https://github.com/nkgd012-tech/Geometry-dash-advance-legit-save-file-play-on-gb300" target="_blank" class="release-btn">
                <i class="fas fa-save"></i> GDA save file
            </a>
        </div>
    </div>

    <!-- GÓC DƯỚI BÊN TRÁI -->
    <div class="bottom-left-footer">
        nkgd012-tech(nkgd2k12_vn) &nbsp;&bull;&nbsp; (C)2026
    </div>

</body>
</html>
