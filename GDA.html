<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GDA Save File</title>


    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Changa:wght@400;600;700;800&family=Share+Tech+Mono&display=swap"
        rel="stylesheet"
    >


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            min-height: 100vh;

            padding:
                80px 20px 120px;

            color: #eeeeee;

            font-family:
                "Changa",
                sans-serif;

            background:

                linear-gradient(
                    rgba(10,14,23,0.70),
                    rgba(10,14,23,0.88)
                ),

                url("https://images.unsplash.com/photo-1511512578047-dfb367046420?w=1920&auto=format&fit=crop");

            background-size: cover;

            background-position: center;

            background-attachment: fixed;

        }


        .top-bar {

            position: fixed;

            top: 20px;

            left: 20px;

            z-index: 100;

        }


        .back-btn {

            display: inline-block;

            padding:
                10px 16px;

            color: #ffffff;

            background:
                rgba(15,23,42,0.90);

            border:
                2px solid #334155;

            border-radius: 6px;

            font-family:
                "Share Tech Mono",
                monospace;

            text-decoration: none;

            transition: 0.2s;

        }


        .back-btn:hover {

            color: #000000;

            background: #00f2ff;

            border-color: #ffffff;

            box-shadow:
                0 0 20px
                #00f2ff;

        }


        .container {

            width: 100%;

            max-width: 800px;

            margin: auto;

        }


        .panel {

            padding: 35px;

            text-align: center;

            background:
                rgba(15,23,42,0.90);

            border:
                2px solid #1e293b;

            border-top:
                4px solid #3a82f6;

            border-radius: 8px;

            box-shadow:
                0 20px 50px
                rgba(0,0,0,0.9);

            backdrop-filter:
                blur(12px);

        }


        .title {

            margin-bottom: 25px;

            color: #ffffff;

            font-size: 2.2rem;

            font-weight: 800;

        }


        .preview-image {

            width: 100%;

            max-width: 700px;

            display: block;

            margin:
                0 auto 30px;

            border:
                2px solid #334155;

            border-radius: 8px;

            box-shadow:
                0 0 25px
                rgba(0,242,255,0.25);

        }


        .description {

            margin-bottom: 25px;

            color: #cbd5e1;

            line-height: 1.7;

        }


        .buttons {

            display: flex;

            flex-direction: column;

            gap: 15px;

        }


        .download-btn {

            display: block;

            padding:
                13px 20px;

            color: #ffffff;

            background:
                rgba(30,41,59,0.95);

            border:
                2px solid #334155;

            border-radius: 6px;

            font-weight: 600;

            text-decoration: none;

            transition: 0.2s;

        }


        .download-btn:hover {

            color: #000000;

            background: #00f2ff;

            border-color: #ffffff;

            transform:
                translateY(-3px);

            box-shadow:
                0 0 20px
                rgba(0,242,255,0.8);

        }


        /* MUSIC */

        .music-button {

            position: fixed;

            right: 20px;

            bottom: 20px;

            z-index: 99999;

            padding:
                12px 18px;

            color: #000000;

            background: #00f2ff;

            border:
                2px solid #ffffff;

            border-radius: 8px;

            font-family:
                "Share Tech Mono",
                monospace;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 0 15px
                rgba(0,242,255,0.8);

        }


        .music-button.off {

            color: #ffffff;

            background:
                rgba(10,14,23,0.95);

            border-color:
                #334155;

            box-shadow: none;

        }


        @media (max-width:600px) {

            body {

                padding:
                    80px 15px 100px;

            }


            .panel {

                padding:
                    25px 18px;

            }


            .title {

                font-size:
                    1.7rem;

            }


            .music-button {

                right: 15px;

                bottom: 15px;

            }

        }

    </style>

</head>


<body>


    <!-- NHẠC -->

    <audio
        id="backgroundMusic"
        src="./menuLoop.mp3"
        autoplay
        loop
        preload="auto"
    ></audio>


    <!-- BACK -->

    <div class="top-bar">

        <a
            href="./index.html"
            class="back-btn"
        >

            ← BACK TO HOME

        </a>

    </div>


    <!-- CONTENT -->

    <main class="container">

        <section class="panel">


            <h1 class="title">

                GEOMETRY DASH ADVANCE

            </h1>


            <img
                src="./GDA.jpg"
                alt="Geometry Dash Advance Save File"
                class="preview-image"
            >


            <p class="description">

                Geometry Dash Advance legit
                save file play on GB300.

            </p>


            <div class="buttons">


                <a
                    href="https://github.com/nkgd012-tech/Geometry-dash-advance-legit-save-file-play-on-gb300"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="download-btn"
                >

                    🔗 VIEW GDA PROJECT ON GITHUB

                </a>


                <a
                    href="./GDA.save.file.zip"
                    download
                    class="download-btn"
                >

                    📦 DOWNLOAD GDA.save.file.zip

                </a>


            </div>


        </section>

    </main>


    <!-- MUSIC BUTTON -->

    <button
        id="musicButton"
        class="music-button"
        type="button"
    >

        🔊 MUSIC ON

    </button>


    <script>

        const music =
            document.getElementById(
                "backgroundMusic"
            );

        const musicButton =
            document.getElementById(
                "musicButton"
            );


        let musicOn = true;


        function updateMusicButton() {

            if (musicOn) {

                musicButton.textContent =
                    "🔊 MUSIC ON";

                musicButton.classList.remove(
                    "off"
                );

            } else {

                musicButton.textContent =
                    "🔇 MUSIC OFF";

                musicButton.classList.add(
                    "off"
                );

            }

        }


        musicButton.addEventListener(
            "click",
            function () {

                if (musicOn) {

                    music.pause();

                    musicOn = false;

                } else {

                    music.play()
                        .then(function () {

                            musicOn = true;

                            updateMusicButton();

                        });

                    return;

                }


                updateMusicButton();

            }
        );


        window.addEventListener(
            "load",
            function () {

                musicOn = true;

                updateMusicButton();


                music.play()
                    .catch(function () {

                        console.log(
                            "Autoplay bị chặn. Bấm MUSIC ON để phát nhạc."
                        );

                    });

            }
        );

    </script>


</body>

</html>
