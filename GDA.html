<!DOCTYPE html>
<html lang="vi">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Geometry Dash Advance | NKGD012-TECH</title>


    <!-- GOOGLE FONTS -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Changa:wght@400;600;700;800&family=Share+Tech+Mono&display=swap"
        rel="stylesheet"
    >


    <!-- FONT AWESOME -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <style>

        :root {

            --blue: #3a82f6;

            --cyan: #00eaff;

            --white: #ffffff;

            --muted: #aab6ca;

            --panel: rgba(12,20,35,0.88);

        }


        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }


        html {

            scroll-behavior: smooth;

        }


        body {

            min-height: 100vh;

            overflow-x: hidden;

            color: var(--white);

            font-family: "Changa", sans-serif;

            /*
            ẢNH NỀN GIỐNG SẢNH CHÍNH
            */

            background:

                linear-gradient(

                    rgba(5,9,18,0.65),

                    rgba(5,9,18,0.80)

                ),

                url("https://images.unsplash.com/photo-1511512578047-dfb367046420?w=1920&auto=format&fit=crop")

                center center / cover fixed;

        }


        /*
        HIỆU ỨNG NỀN
        */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            z-index: 0;

            pointer-events: none;

            background:

                radial-gradient(

                    circle at 20% 20%,

                    rgba(0,234,255,0.12),

                    transparent 30%

                ),

                radial-gradient(

                    circle at 80% 80%,

                    rgba(139,92,246,0.12),

                    transparent 30%

                );

        }


        /*
        TOP BAR
        */

        .top-bar {

            position: relative;

            z-index: 10;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 20px 25px;

            background: rgba(5,10,20,0.65);

            border-bottom: 1px solid rgba(255,255,255,0.1);

            backdrop-filter: blur(10px);

        }


        .site-name {

            padding-left: 12px;

            border-left: 3px solid var(--blue);

            font-family: "Share Tech Mono", monospace;

            font-size: 1rem;

            letter-spacing: 2px;

        }


        /*
        HOME
        */

        .home-btn {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            padding: 10px 18px;

            color: #ffffff;

            background: rgba(20,31,52,0.9);

            border: 2px solid #405273;

            border-radius: 8px;

            text-decoration: none;

            transition: 0.25s ease;

        }


        .home-btn:hover {

            color: #000000;

            background: var(--cyan);

            border-color: #ffffff;

            transform: translateY(-3px);

            box-shadow:

                0 0 12px var(--cyan),

                0 0 30px rgba(0,234,255,0.45);

        }


        /*
        MAIN
        */

        main {

            position: relative;

            z-index: 2;

            min-height: calc(100vh - 75px);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 60px 20px;

        }


        /*
        CARD
        */

        .gda-card {

            width: 100%;

            max-width: 900px;

            padding: 40px;

            text-align: center;

            background: var(--panel);

            border: 1px solid rgba(255,255,255,0.12);

            border-top: 4px solid var(--blue);

            border-radius: 15px;

            backdrop-filter: blur(12px);

            box-shadow:

                0 20px 60px rgba(0,0,0,0.65);

        }


        /*
        TITLE
        */

        .title {

            margin-bottom: 10px;

            font-size: 2.5rem;

            font-weight: 800;

            letter-spacing: 2px;

            text-shadow:

                0 0 8px var(--cyan),

                0 0 25px rgba(0,234,255,0.7);

        }


        .description {

            margin-bottom: 30px;

            color: var(--muted);

            line-height: 1.7;

        }


        /*
        ẢNH GDA
        */

        .preview-image {

            display: block;

            width: 100%;

            max-width: 700px;

            max-height: 70vh;

            margin: 0 auto 35px;

            object-fit: contain;

            border: 2px solid var(--blue);

            border-radius: 12px;

            background: #000000;

            box-shadow:

                0 0 15px rgba(58,130,246,0.65),

                0 0 40px rgba(0,234,255,0.18);

        }


        /*
        DOWNLOAD
        */

        .download-area {

            padding-top: 30px;

            border-top: 1px solid rgba(255,255,255,0.15);

        }


        .download-title {

            margin-bottom: 10px;

            font-size: 1.6rem;

        }


        .download-description {

            margin-bottom: 25px;

            color: var(--muted);

        }


        /*
        DOWNLOAD BUTTON
        */

        .download-btn {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            padding: 14px 26px;

            color: #ffffff;

            background: rgba(20,31,52,0.95);

            border: 2px solid #405273;

            border-radius: 8px;

            font-weight: 700;

            text-decoration: none;

            transition: 0.25s ease;

        }


        .download-btn:hover {

            color: #000000;

            background: var(--cyan);

            border-color: #ffffff;

            transform: translateY(-3px);

            box-shadow:

                0 0 12px var(--cyan),

                0 0 30px rgba(0,234,255,0.5);

        }


        /*
        BACK HOME
        */

        .back-home {

            display: block;

            width: fit-content;

            margin: 22px auto 0;

            color: var(--muted);

            text-decoration: none;

            transition: 0.2s ease;

        }


        .back-home:hover {

            color: var(--cyan);

        }


        /*
        FOOTER
        */

        .footer {

            position: relative;

            z-index: 2;

            padding: 20px;

            color: var(--muted);

            text-align: center;

            font-family: "Share Tech Mono", monospace;

            font-size: 0.85rem;

        }


        /*
        MOBILE
        */

        @media (max-width: 700px) {

            .top-bar {

                padding: 15px;

            }


            .site-name {

                font-size: 0.72rem;

                letter-spacing: 1px;

            }


            .home-btn {

                padding: 7px 11px;

                font-size: 0.72rem;

            }


            main {

                padding: 35px 15px;

            }


            .gda-card {

                padding: 25px 15px;

            }


            .title {

                font-size: 1.75rem;

            }


            .preview-image {

                max-height: 55vh;

            }


            .download-btn {

                width: 100%;

            }

        }

    </style>

</head>


<body>


    <!-- TOP BAR -->

    <header class="top-bar">


        <div class="site-name">

            NKGD012-TECH WEB

        </div>


        <a
            class="home-btn"
            href="./index.html"
        >

            <i class="fas fa-house"></i>

            HOME

        </a>


    </header>


    <!-- MAIN -->

    <main>


        <section class="gda-card">


            <h1 class="title">

                GEOMETRY DASH ADVANCE

            </h1>


            <p class="description">

                Geometry Dash Advance Legit Save File
                for playing on GB300.

            </p>


            <!-- ẢNH GDA -->

            <img
                class="preview-image"
                src="./GDA.jpg"
                alt="Geometry Dash Advance Save File Preview"
            >


            <!-- DOWNLOAD -->

            <div class="download-area">


                <h2 class="download-title">

                    DOWNLOAD

                </h2>


                <p class="download-description">

                    Nhấn vào nút bên dưới để truy cập
                    repository GitHub và tải
                    Geometry Dash Advance Save File.

                </p>


                <a
                    class="download-btn"

                    href="https://github.com/nkgd012-tech/Geometry-dash-advance-legit-save-file-play-on-gb300"

                    target="_blank"

                    rel="noopener noreferrer"
                >

                    <i class="fab fa-github"></i>

                    DOWNLOAD GDA SAVE FILE

                </a>


                <a
                    class="back-home"
                    href="./index.html"
                >

                    <i class="fas fa-arrow-left"></i>

                    &nbsp;

                    Quay lại sảnh chính

                </a>


            </div>


        </section>


    </main>


    <!-- FOOTER -->

    <footer class="footer">

        nkgd012-tech (NKGD2K12_VN)

        &nbsp;&bull;&nbsp;

        © 2026

    </footer>


</body>

</html>
